[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iktisad"
version = "0.2.0"
description = "Zero-waste, frugal token defense engine & native MCP server for AI coding agents — Token Bill Defense, Rate Limit Armor & Context Retention"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kenz Labs", email = "oss@kenz.tech"}
]
keywords = [
    "ai-agents",
    "token-efficiency",
    "frugalgpt",
    "model-context-protocol",
    "mcp-server",
    "rate-limit-armor",
    "circuit-breaker",
    "llm-routing",
    "context-retention",
    "iktisad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
iktisad = "iktisad.cli:main"
iktisad-guard = "iktisad.cli:main"
iktisad-mcp = "iktisad.mcp_server:main"

[project.urls]
Homepage = "https://shiny-apricot.github.io/iktisad/"
Documentation = "https://shiny-apricot.github.io/iktisad/"
Repository = "https://github.com/shiny-apricot/iktisad"
"Polar Pro ($10/mo)" = "https://buy.polar.sh/polar_cl_yzz3PkDzy0RGI5tD7PCly2oMkieyP5jUPKrF11bpqcA"
"Bug Tracker" = "https://github.com/shiny-apricot/iktisad/issues"
